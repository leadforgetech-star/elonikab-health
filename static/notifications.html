<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>Mes notifications - Elonikab Health</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="preconnect" href="https://options-lbs-focuses-structure.trycloudflare.com" crossorigin>
<meta name="theme-color" content="#174A7E">
<link rel="stylesheet" href="/static/patient_common.css?v=24">
<link rel="stylesheet" href="/static/patient_nav.css?v=10">
<script src="/static/safe_locale.js"></script>
<script src="/static/prefetch.js"></script>
<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:var(--pt-bg);color:var(--pt-ink);margin:0;
  line-height:1.5;-webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.pt-header{
  background:#fff;border-bottom:1px solid var(--pt-line);
  position:sticky;top:0;z-index:50;
}
.pt-header-inner{
  max-width:720px;margin:0 auto;padding:14px 18px;
  display:flex;align-items:center;gap:14px;
}
.pt-back{
  width:36px;height:36px;border-radius:10px;
  border:1px solid var(--pt-line);background:#fff;
  color:var(--pt-ink);font-size:18px;
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;flex-shrink:0;
}
.pt-back:hover{border-color:var(--pt-blue);color:var(--pt-blue)}
.pt-title{font-size:16px;font-weight:800;flex:1}
.pt-clear-btn{
  background:none;border:1px solid var(--pt-line);
  color:var(--pt-muted);font-size:12px;font-weight:700;
  padding:7px 12px;border-radius:9px;cursor:pointer;
  font-family:inherit;white-space:nowrap;transition:.15s;
}
.pt-clear-btn:hover{
  border-color:var(--pt-danger);color:var(--pt-danger);
  background:var(--pt-danger-soft);
}

.pt-notif-list{
  max-width:720px;margin:0 auto;padding:18px 18px 60px;
}
.pt-notif{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px 16px;margin-bottom:8px;
  background:#fff;border:1px solid var(--pt-line);
  border-radius:12px;cursor:pointer;transition:.15s;
  text-decoration:none;color:inherit;
}
.pt-notif:hover{
  border-color:var(--pt-blue);
  box-shadow:0 6px 20px rgba(23,74,126,.08);
  transform:translateY(-1px);
}
.pt-notif.unread{
  background:linear-gradient(90deg,#F0F6FC 0%,#fff 70%);
  border-left:3px solid var(--pt-blue);
}
.pt-notif-ico{
  width:38px;height:38px;border-radius:11px;
  background:var(--pt-blue-soft);color:var(--pt-blue);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0;
}
.pt-notif.unread .pt-notif-ico{
  background:var(--pt-blue);color:#fff;
}
.pt-notif-body{flex:1;min-width:0}
.pt-notif-title{
  font-size:14px;font-weight:800;color:var(--pt-ink);
  margin:0 0 3px;line-height:1.3;word-break:break-word;
}
.pt-notif-text{
  font-size:13px;color:var(--pt-muted);line-height:1.45;
  word-break:break-word;
}
.pt-notif-date{
  font-size:11px;color:#94a3b8;
  margin-top:6px;font-weight:600;
}
.pt-notif-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--pt-danger);flex-shrink:0;margin-top:15px;
}
.pt-notif.read .pt-notif-dot{display:none}

.pt-empty{
  text-align:center;padding:60px 20px;color:var(--pt-muted);
}
.pt-empty-ico{
  font-size:56px;opacity:.35;margin-bottom:14px;display:block;
}
.pt-empty h2{
  font-size:18px;color:var(--pt-ink);margin:0 0 6px;
}
.pt-empty p{font-size:14px;margin:0}
</style>
</head>
<body>

<header class="pt-header">
  <div class="pt-header-inner">
    <a class="pt-back" href="/compte" aria-label="Retour">&#8592;</a>
    <span class="pt-title">Mes notifications</span>
    <button class="pt-clear-btn" id="btn-clear" type="button">Nettoyer</button>
  </div>
</header>

<main class="pt-notif-list" id="list">
  <div class="pt-empty">
    <span class="pt-empty-ico">&#128276;</span>
    <h2>Chargement...</h2>
  </div>
</main>

<div id="toast" style="position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#174A7E;color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:700;z-index:99999;box-shadow:0 8px 24px rgba(15,23,42,.2);display:none"></div>

<script src="/static/patient_nav.js?v=12"></script>
<script src="/static/professional_realtime.js?v=10"></script>
<script src="/static/notifications.js?v=20"></script>
<script id="eh-force-header">
(function () {
  function forceHeader() {
    try {
      var h = document.querySelector(".pt-mini-header");
      if (!h) return;
      // Force les styles en inline (priorite maximale)
      h.style.setProperty("width", "100%", "important");
      h.style.setProperty("max-width", "100%", "important");
      h.style.setProperty("display", "block", "important");
      h.style.setProperty("box-sizing", "border-box", "important");
      h.style.setProperty("position", "sticky", "important");
      h.style.setProperty("top", "0", "important");
      h.style.setProperty("z-index", "9500", "important");
      h.style.setProperty("background", "#fff", "important");
      h.style.setProperty("border-bottom", "1px solid #E2E8F0", "important");
      var inner = h.querySelector(".pt-mini-header-inner");
      if (inner) {
        inner.style.setProperty("width", "100%", "important");
        inner.style.setProperty("max-width", "1180px", "important");
        inner.style.setProperty("margin-left", "auto", "important");
        inner.style.setProperty("margin-right", "auto", "important");
        inner.style.setProperty("display", "flex", "important");
        inner.style.setProperty("justify-content", "space-between", "important");
        inner.style.setProperty("align-items", "center", "important");
        inner.style.setProperty("box-sizing", "border-box", "important");
      }
    } catch (e) {}
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", forceHeader);
  } else {
    forceHeader();
  }
  window.addEventListener("load", function () { setTimeout(forceHeader, 100); });
})();
</script>
</body>
</html>
